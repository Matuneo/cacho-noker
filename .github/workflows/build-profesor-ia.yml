name: Compilar Profesor IA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profesor-ia-android/**"
      - ".github/workflows/build-profesor-ia.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p profesor-ia-android :app:assembleDebug

      - name: Preparar descarga
        shell: bash
        run: |
          mkdir -p dist
          cp profesor-ia-android/app/build/outputs/apk/debug/app-debug.apk dist/PROFESOR-IA-PYTHON-ANDROID-v1.0.0.apk
          cd dist
          sha256sum PROFESOR-IA-PYTHON-ANDROID-v1.0.0.apk > PROFESOR-IA-PYTHON-ANDROID-v1.0.0.apk.sha256
          ls -lh .

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PROFESOR-IA-APK
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
