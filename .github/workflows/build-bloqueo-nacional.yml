name: Compilar Bloqueo Nacional APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bloqueo-nacional-android/**"
      - ".github/workflows/build-bloqueo-nacional.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace -p bloqueo-nacional-android :app:assembleDebug 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            grep -E '(^e: |^error: |FAILURE:|What went wrong|Execution failed|Could not resolve|Could not find)' build.log \
              | tail -n 40 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$build_status"

      - name: Preparar APK y suma de verificación
        shell: bash
        run: |
          mkdir -p entrega
          cp bloqueo-nacional-android/app/build/outputs/apk/debug/app-debug.apk entrega/BLOQUEO-NACIONAL-LA-MARCHA-FINAL-v1.0.0.apk
          cd entrega
          sha256sum BLOQUEO-NACIONAL-LA-MARCHA-FINAL-v1.0.0.apk > BLOQUEO-NACIONAL-LA-MARCHA-FINAL-v1.0.0.apk.sha256

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOQUEO-NACIONAL-APK
          path: entrega/*
          if-no-files-found: error
          retention-days: 30

