name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK, NDK y CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Incorporar motores, modelos y LAME
        shell: bash
        run: bash scripts/prepare_dependencies.sh

      - name: Compilar APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar APK y suma SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CLONO-Y-MEJORO-MI-VOZ-v1.0.0.apk
          cd dist
          sha256sum CLONO-Y-MEJORO-MI-VOZ-v1.0.0.apk > CLONO-Y-MEJORO-MI-VOZ-v1.0.0.apk.sha256
          ls -lh .

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CLONO-Y-MEJORO-MI-VOZ-APK
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publicar descarga directa v1.0.0
    if: github.event_name == 'push' && github.event.head_commit.message == 'Publicar APK con enlace directo en GitHub Releases'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar APK compilado
        uses: actions/download-artifact@v4
        with:
          name: CLONO-Y-MEJORO-MI-VOZ-APK
          path: dist

      - name: Publicar APK en GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 dist/* \
            --title "CLONO Y MEJORO MI VOZ v1.0.0" \
            --notes "APK Android arm64-v8a. Motor local sin internet, clonación de voz, narrador en español y exportación WAV/MP3."
